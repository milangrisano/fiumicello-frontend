<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Sistema de gestion de Fiumicello — POS, contabilidad y reportes.">

  <!-- PWA / theme -->
  <meta name="theme-color" content="#0E2A3A">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fiumicello">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fiumicello</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // The value below is injected by flutter build, do not touch.
    var serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });

    // Auto-actualizacion: si el build desplegado cambia (version.json), recarga
    // una sola vez para tomar la nueva version y evitar servir un bundle viejo.
    (function () {
      var versionCargada = null;
      async function chequearVersion() {
        try {
          var res = await fetch('version.json?t=' + Date.now(), { cache: 'no-store' });
          if (!res.ok) return;
          var v = (await res.json()).version;
          if (versionCargada === null) { versionCargada = v; return; }
          if (v && v !== versionCargada) {
            versionCargada = v;
            window.location.reload();
          }
        } catch (e) { /* silencioso */ }
      }
      chequearVersion();
      setInterval(chequearVersion, 60000); // cada minuto
    })();
  </script>
</body>
</html>
