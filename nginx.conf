# Nginx config for Fiumicello frontend (production)
# Serves the Flutter web build and proxies /api to the backend service.

server {
    listen 80;
    server_name _;

    # Permitir subida de imágenes de facturas/comprobantes (OCR). El default de
    # nginx es 1m y las fotos escaneadas lo superan; coincide con el límite de
    # multer del backend (20 MB).
    client_max_body_size 20m;
    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguridad (mitigan clickjacking, MIME-sniffing, etc.).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: lo gestiona Cloudflare en el edge por defecto (ver panel Cloudflare).
    # Si se sirve HTTPS directo, activar descomentando:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA fallback: route all non-file paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Imágenes de facturas/comprobantes: carpeta montada (volumen compartido
    # con el backend). El OCR y la carga manual guardan ahí; se sirven por la
    # URL /archivos/<archivo>.
    location /archivos/ {
        alias /usr/share/nginx/html/archivos/;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # CORS: Flutter web (Image.network) pide la imagen con Origin; si no se
        # autoriza, el navegador bloquea la imagen aunque el archivo exista.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) { return 204; }
    }

    # Cache-busting: nunca cachear el bootstrap ni el bundle Dart, y tampoco el
    # index.html/version.json/manifest (para que las actualizaciones de la PWA se
    # tomen siempre del servidor y no quede una version vieja servida).
    location ~* \.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location ~* \.(html|json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # Reverse proxy to the backend service (docker-compose service name)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}