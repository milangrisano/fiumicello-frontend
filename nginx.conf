# Nginx config for Fiumicello frontend (production)
# Serves the Flutter web build and proxies /api to the backend service.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: route all non-file paths to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache-busting: nunca cachear el bootstrap ni el bundle Dart, y tampoco el
    # index.html/version.json/manifest (para que las actualizaciones de la PWA se
    # tomen siempre del servidor y no quede una version vieja servida).
    location ~* \.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(html|json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reverse proxy to the backend service (docker-compose service name)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}