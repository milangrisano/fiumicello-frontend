name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- GATE de producción: SOLO en tags v* ----
      # Si flutter analyze da error, este paso falla, el job se detiene en este punto
      # y NO se llega al paso de construcción de la imagen :latest (producción).
      # El push a main (rama :test) NO pasa por este gate.
      - name: Set up Flutter (gate produccion)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies (gate produccion)
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter pub get

      - name: Run flutter analyze (gate produccion)
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter analyze --no-pub --fatal-warnings

      # ---- Push a main -> entorno de PRUEBAS (hpserver:8080) usa :test ----
      - name: Build and push frontend image (test)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fiumicello-frontend:test
            ${{ secrets.DOCKERHUB_USERNAME }}/fiumicello-frontend:test-${{ github.sha }}

      # ---- Tag de version (vX.Y.Z) -> PRODUCCION (Lenovo:8080) usa :latest ----
      # Como los pasos de gate corren ANTES en el job y fallan el job si hay errores,
      # este paso solo se alcanza si flutter analyze pasó sin warnings/errores.
      - name: Build and push frontend image (latest / produccion)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fiumicello-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/fiumicello-frontend:${{ github.ref_name }}